x="22" y="394" fill="#f87171" xml:space="preserve"> 4. [KRİTİK] 1 yıldızlı yorum yanıtsız (P-3001)</text><text x="22" y="414" fill="#cbd5e1" xml:space="preserve">     durum : “Ürün geldi ama kutusu ezilmişti, fermuarı da takılıyor. İade etmek istiyorum.” ·</text><text x="22" y="434" fill="#cbd5e1" xml:space="preserve">             02.10.2026 tarihinde geldi, hâlâ cevap yok.</text><text x="22" y="454" fill="#cbd5e1" xml:space="preserve">     aksiyon: Aynı gün içinde çözüm odaklı cevap yazın; iade/değişim teklifini açıkça belirtin.</text><text x="22" y="474" fill="#cbd5e1" xml:space="preserve">     kayıt : P-3001</text><text x="22" y="494" fill="#fbbf24" xml:space="preserve"> 5. [UYARI] Fiyat listeden yüksek: Yün Atkı - Antrasit</text><text x="22" y="514" fill="#cbd5e1" xml:space="preserve">     durum : Satış fiyatı 249.90 TL, liste fiyatı 199.90 TL. İndirimli görünmesi gereken ürün</text><text x="22" y="534" fill="#cbd5e1" xml:space="preserve">             indirimsiz görünüyor.</text><text x="22" y="554" fill="#cbd5e1" xml:space="preserve">     aksiyon: Fiyat alanlarını kontrol edin; indirim oranını yeniden tanımlayın.</text><text x="22" y="574" fill="#cbd5e1" xml:space="preserve">     kayıt : P-3005</text><text x="22" y="594" fill="#fbbf24" xml:space="preserve"> 6. [UYARI] Hazırlanmayan sipariş: TY-1002</text><text x="22" y="614" fill="#cbd5e1" xml:space="preserve">     durum : trendyol · Müşteri B · durum: hazırlanıyor. Sipariş 52 saattir hazırlanmayı bekliyor</text><text x="22" y="634" fill="#cbd5e1" xml:space="preserve">             (eşik: 48 saat).</text><text x="22" y="654" fill="#cbd5e1" xml:space="preserve">     aksiyon: Siparişi bugün paketleyip kargo etiketi oluşturun.</text><text x="22" y="674" fill="#cbd5e1" xml:space="preserve">     kayıt : TY-1002</text><text x="22" y="694" fill="#fbbf24" xml:space="preserve"> 7. [UYARI] Tekrarlayan iade nedeni (3 kez): beden uyumsuz</text><text x="22" y="714" fill="#cbd5e1" xml:space="preserve">     durum : Son 30 günd