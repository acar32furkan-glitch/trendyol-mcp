name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Matris yorumlayıcısını uv'ye sabitliyoruz: aksi hâlde `uv sync`/`uv run` .python-version'a
    # dönüp venv'i yeniden kurar ve "3.13" işi sessizce 3.12 koşar.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Kurulan yorumlayıcıyı doğrula
        run: |
          uv run python -c "import sys; v=f'{sys.version_info[0]}.{sys.version_info[1]}'; assert v == '${{ matrix.python-version }}', f'beklenen ${{ matrix.python-version }}, gelen {v}'; print('python', v)"
          uv run ruff --version

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Tests with coverage
        # server.py yalnızca alt süreçte (stdio) çalıştığı için coverage orada 0 görünür;
        # entegrasyon testi onu canlı olarak doğrular (tests/test_server_mcp.py).
        run: uv run pytest --cov=trendyol_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  smoke:
    name: CLI smoke test (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Sunucu kimlik bilgisi olmadan da çalışmalı
        run: |
          uv run trendyol-mcp check
          uv run trendyol-mcp tools
          uv run trendyol-mcp demo | tee demo.txt
          grep -q "GÜNLÜK SATICI ÖZETİ" demo.txt
          grep -q "KRİTİK" demo.txt
