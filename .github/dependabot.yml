version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      python-dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "respx", "types-*"]
      python-runtime:
        patterns: ["pydantic*", "httpx", "mcp", "pyyaml", "uvicorn*", "starlette"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
